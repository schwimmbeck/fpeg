<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 554" role="img" aria-label="Loading a grammar reads, checks and compiles its text into a program once. Each parse runs that program in the parsing machine over an input text, and the machine builds a tree in native memory. Code reads the tree through Tree and Token views, or a Transformer turns it into values.">
  <defs>
    <marker id="pipeline-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path class="arrowhead" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <g class="box">
    <rect x="20" y="20" width="280" height="58" rx="8"/>
    <text class="title" x="160" y="45" text-anchor="middle">grammar text</text>
    <text x="160" y="64" text-anchor="middle">a string or a file</text>
  </g>
  <g class="box">
    <rect x="380" y="20" width="280" height="58" rx="8"/>
    <text class="title" x="520" y="45" text-anchor="middle">input text</text>
    <text x="520" y="64" text-anchor="middle">the text a parse reads</text>
  </g>
  <g class="box">
    <rect x="20" y="134" width="280" height="58" rx="8"/>
    <text class="title" x="160" y="159" text-anchor="middle">program</text>
    <text x="160" y="178" text-anchor="middle">read, checked and compiled once</text>
  </g>
  <g class="box accent">
    <rect x="380" y="134" width="280" height="58" rx="8"/>
    <text class="title" x="520" y="159" text-anchor="middle">parsing machine</text>
    <text x="520" y="178" text-anchor="middle">tries, remembers, keeps to its limits</text>
  </g>
  <g class="box accent">
    <rect x="380" y="248" width="280" height="58" rx="8"/>
    <text class="title" x="520" y="273" text-anchor="middle">tree</text>
    <text x="520" y="292" text-anchor="middle">one compact array in native memory</text>
  </g>
  <g class="box">
    <rect x="20" y="362" width="280" height="58" rx="8"/>
    <text class="title" x="160" y="387" text-anchor="middle">views</text>
    <text x="160" y="406" text-anchor="middle">Tree and Token, made when read</text>
  </g>
  <g class="box">
    <rect x="380" y="362" width="280" height="58" rx="8"/>
    <text class="title" x="520" y="387" text-anchor="middle">Transformer</text>
    <text x="520" y="406" text-anchor="middle">one native scan, methods and builders</text>
  </g>
  <g class="box">
    <rect x="380" y="476" width="280" height="58" rx="8"/>
    <text class="title" x="520" y="501" text-anchor="middle">your values</text>
    <text x="520" y="520" text-anchor="middle">objects, numbers, a syntax tree</text>
  </g>
  <path class="arrow" d="M160,78 V130" marker-end="url(#pipeline-arrow)"/>
  <text class="code" x="172" y="110">Grammar(text)</text>
  <path class="arrow" d="M520,78 V130" marker-end="url(#pipeline-arrow)"/>
  <text class="code" x="532" y="110">grammar.parse(text)</text>
  <path class="arrow" d="M300,163 H376" marker-end="url(#pipeline-arrow)"/>
  <text x="340" y="155" text-anchor="middle">runs in</text>
  <path class="arrow" d="M520,192 V244" marker-end="url(#pipeline-arrow)"/>
  <text x="532" y="224">builds</text>
  <path class="arrow" d="M380,277 H160 V358" marker-end="url(#pipeline-arrow)"/>
  <text x="270" y="269" text-anchor="middle">read</text>
  <path class="arrow" d="M520,306 V358" marker-end="url(#pipeline-arrow)"/>
  <text class="code" x="532" y="338">transform(tree)</text>
  <path class="arrow" d="M520,420 V472" marker-end="url(#pipeline-arrow)"/>
  <text x="532" y="452">returns</text>
</svg>
