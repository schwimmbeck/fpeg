[package]
name = "fpeg-py"
description = "The native module of the fpeg Python package"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "_fpeg"
crate-type = ["cdylib"]
