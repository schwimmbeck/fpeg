[package]
name = "fastpeg"
description = "A PEG parsing library: grammars loaded at runtime, a bytecode parsing machine and a lossless parse tree"
readme = "../../README.md"
keywords = ["parser", "peg", "grammar", "parsing"]
categories = ["parsing"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
# The reference interpreter, for tests and fuzzing only.
reference = []

[dependencies]
unicode-ident = "1.0.27"

[dev-dependencies]
# Turns on the reference interpreter for this crate's own tests.
fastpeg = { path = ".", features = ["reference"] }

[lints]
workspace = true
