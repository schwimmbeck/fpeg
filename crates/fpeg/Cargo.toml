[package]
name = "fpeg"
description = "A PEG parsing library: grammars loaded at runtime, a bytecode parsing machine and a lossless parse tree"
readme = "../../README.md"
keywords = ["parser", "peg", "grammar", "parsing"]
categories = ["parsing"]
# The sources and the grammars they embed. The tests and the samples stay in the repository.
include = [
    "src/**/*.rs",
    "grammars/common.fpeg",
    "grammars/json.fpeg",
    "grammars/python.fpeg",
    "LICENSE-APACHE",
    "LICENSE-MIT",
]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
# The reference interpreter, for tests and fuzzing only.
reference = []

[dependencies]
unicode-ident = "1.0.27"

[dev-dependencies]
# Turns on the reference interpreter for this crate's own tests.
fpeg = { path = ".", features = ["reference"] }

[lints]
workspace = true
