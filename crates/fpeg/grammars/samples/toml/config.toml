# A configuration file.
title = "fpeg"
version = 1
ratio = 0.25
huge = 1_000_000
hex = 0xDEAD_beef
enabled = true
"quoted key" = 'literal \ string'
nested.dotted.key = -3e-2

[server]
host = "localhost"
ports = [
  8000,
  8001, # the second one
  8002,
]
limits = { cpu = 2, memory = "1G" }
point = {
  x = 1, # the first
  y = 2,
}
colour = "\e[1m\x41\e[0m"

[[plugins]]
name = "a"

[[plugins]]
name = "b"
notes = """
two
lines"""
pattern = '''
\d+ "kept" \n
as written'''
said = """she said "yes"""" # the content ends in a quote
joined = """a \
    b"""
