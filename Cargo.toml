[workspace]
members = ["crates/fpeg", "crates/fpeg-cli", "crates/fpeg-py"]
exclude = ["benchmarks/rust", "fuzz"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
authors = ["Dominik Schwimmbeck"]
repository = "https://github.com/schwimmbeck/fpeg"
homepage = "https://schwimmbeck.github.io/fpeg/"

[workspace.dependencies]
fpeg = { path = "crates/fpeg", version = "0.1.0" }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
# An allow needs its reason beside it, and every unsafe block its SAFETY comment.
allow_attributes_without_reason = "warn"
undocumented_unsafe_blocks = "warn"

[profile.release]
lto = "fat"
codegen-units = 1
