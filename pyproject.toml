[build-system]
requires = ["maturin>=1.16,<2"]
build-backend = "maturin"

[project]
name = "fpeg"
description = "A PEG parsing library with a native engine and a Transformer for parse trees"
readme = "README.md"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
authors = [{ name = "Dominik Schwimmbeck" }]
requires-python = ">=3.11"
keywords = ["parser", "peg", "grammar", "parsing", "transformer"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Compilers",
    "Topic :: Text Processing",
    "Typing :: Typed",
]
dynamic = ["version"]

[project.urls]
Repository = "https://github.com/schwimmbeck/fpeg"
Changelog = "https://github.com/schwimmbeck/fpeg/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "maturin>=1.16",
    "mypy>=2.4.1",
    "pyright>=1.1.414",
    "pytest>=9.2",
    "reuse>=6.3.0",
    "ruff>=0.17.5",
]
docs = ["furo>=2025.12.19", "myst-parser>=5.2", "sphinx>=9.2"]
bench = [
    "libcst>=1.9",
    "lark>=1.3.1",
    "pe>=0.6",
    "pyperf>=2.11",
    "tree-sitter>=0.26.1",
    "tree-sitter-python>=0.25",
]
# What a test compares fpeg with beyond the standard library. A test skips without its oracle.
oracles = ["lark>=1.3.1", "llvmlite>=0.50"]

[tool.maturin]
manifest-path = "crates/fpeg-py/Cargo.toml"
python-source = "python"
module-name = "fpeg._fpeg"
# What a build with --pgo runs on the instrumented module, from the root of the repository.
pgo-command = "python scripts/pgo_training.py"

[tool.uv]
# One uv range for development and CI, where setup-uv installs the highest version in it, so
# that the lock file does not drift between them.
required-version = ">=0.13.8,<0.14"
# Rebuild the native module when the Rust sources or the grammars compiled into it change.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "crates/**/*.rs" },
    { file = "crates/**/*.fpeg" },
    { file = "crates/**/Cargo.toml" },
]

[tool.uv.dependency-groups]
docs = { requires-python = ">=3.13" }

[tool.ruff]
line-length = 100
extend-exclude = ["research", "crates/fpeg/grammars/samples"]

[tool.ruff.lint]
select = ["B", "D", "E", "F", "I", "RUF", "SIM", "UP", "W"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
# The methods of the transformer are named after the rules of the Python grammar, one for each
# kind of node, and the class says what they give.
"python/fpeg/python.py" = ["D102"]

[tool.pyright]
# Benchmarks and docs import their own dependency groups, ruff lints them.
include = ["python", "tests", "scripts"]
strict = ["python"]
pythonVersion = "3.11"
# The tests import helper modules of their own folder, as pytest lets them, the corpora and
# the scripts they check.
extraPaths = ["tests", "benchmarks", "scripts"]
venvPath = "."
venv = ".venv"

[tool.pytest]
testpaths = ["tests"]
addopts = ["--strict-markers", "-m", "not corpus"]
markers = ["corpus: runs over a whole corpus, slow, selected with -m corpus"]
filterwarnings = ["error"]
