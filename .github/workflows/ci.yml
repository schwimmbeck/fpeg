name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, for the benchmark smoke run on Windows and the corpus tests, which pushes skip.
    # Nothing else runs then.
    - cron: "0 3 * * 1"

permissions:
  contents: read

concurrency:
  # A push to main cancels the run of an older push, never the weekly run.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  UV_LOCKED: "1"

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        # Each OS once, and the oldest and newest supported Python between them. The checks job
        # adds the development version.
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: windows-latest
            python: "3.15"
          - os: macos-latest
            python: "3.15"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python }}
      - run: cargo test
      - run: uv sync
      - run: uv run pytest

  checks:
    name: Lints, types, docs and licence headers
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            . -> target
            benchmarks/rust -> target
            fuzz -> target
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --workspace --lib --bins -- -D warnings
      - run: cargo rustdoc -p fpeg -- -D warnings
      - run: cargo fmt --check --manifest-path benchmarks/rust/Cargo.toml
      - run: cargo clippy --manifest-path benchmarks/rust/Cargo.toml --all-targets -- -D warnings
      - run: cargo fmt --check --manifest-path fuzz/Cargo.toml
      - run: cargo clippy --manifest-path fuzz/Cargo.toml --all-targets -- -D warnings
      - run: uv sync
      - run: uv run ruff format --check
      - run: uv run ruff check
      - run: uv run pyright --warnings
      - run: uv run python -m mypy.stubtest fpeg._fpeg
      - run: uv run --group oracles pytest
      - run: uv run python scripts/check_licence_headers.py
      - run: uv run reuse lint
      - run: uv run --group docs sphinx-build -W --keep-going -b html docs docs/_build/html

  coverage:
    name: Coverage
    # After a push alone, since a pull request from a fork gets no token to upload with.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: rustup component add llvm-tools
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-llvm-cov@0.9.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --group oracles --group coverage --no-install-project
      # Release builds, since an instrumented debug build is too slow for the tests that bound
      # time. The Python tests run against the module built so, which counts the binding too.
      - run: |
          source .venv/bin/activate
          source <(cargo llvm-cov show-env --sh)
          cargo llvm-cov clean --workspace
          cargo test --release
          maturin develop --release --uv
          coverage run -m pytest
          cargo llvm-cov report --release --lcov --output-path rust.lcov
          coverage xml -o python.xml
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: rust.lcov,python.xml
          disable_search: true
          use_oidc: true
          fail_ci_if_error: true

  corpus:
    name: Corpus tests
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv run python benchmarks/corpus.py
      - run: uv run --group oracles pytest -m corpus

  benchmarks:
    name: Benchmark smoke run (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'schedule' && '["windows-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            . -> target
            benchmarks/rust -> target
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv run --group bench python benchmarks/run.py --mode smoke
